name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install source dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -X utf8 -m py_compile kindle_reader.py kindle_report.py kindle_manga_ocr.py
      - name: Test
        run: python -X utf8 -m unittest test_kindle_reader -v
